{% extends 'base.html' %}
{% block title %}人物 · MyNovel{% endblock %}
{% block content %}
<div class="app-container" style="text-align:center;padding-top:4rem;">
  <h2 style="font-weight:400;margin-bottom:1rem;">人物</h2>
  <p style="color:#999;margin-bottom:1.5rem;">人物浏览已整合到书架中。请从书架打开一本书，在书页内查看人物卡牌。</p>
  <a href="{{ url_for('books.index') }}" class="btn btn-primary">前往书架</a>
  {% if books %}
  <div style="margin-top:2rem;text-align:left;max-width:500px;margin-left:auto;margin-right:auto;">
    <p style="font-size:0.8rem;color:#999;margin-bottom:0.5rem;">或者直接打开一本书：</p>
    {% for book in books %}
    <a href="{{ url_for('books.index') }}" class="btn btn-sm btn-outline-secondary m-1" style="margin:0.15rem;">{{ book.title }}</a>
    {% endfor %}
  </div>
  {% endif %}
</div>
{% endblock %}
