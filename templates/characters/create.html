{% extends 'base.html' %}
{% block title %}创建人物 · MyNovel{% endblock %}

{% block content %}
<div class="row justify-content-center">
<div class="col-md-8">
<h2 class="mb-4">创建新人物</h2>
<form method="POST" enctype="multipart/form-data">

  <div class="card mb-3">
    <div class="card-header">基本信息</div>
    <div class="card-body">
      <div class="mb-3">
        <label class="form-label">姓名 <span class="text-danger">*</span></label>
        <input type="text" name="name" class="form-control" required>
      </div>
      <div class="row">
        <div class="col-md-5 mb-3">
          <label class="form-label">所属书目</label>
          <select name="book_id" class="form-select">
            <option value="">不指定</option>
            {% for book in books %}<option value="{{ book.id }}" {% if preselected_book_id == book.id %}selected{% endif %}>{{ book.title }}</option>{% endfor %}
          </select>
        </div>
        <div class="col-md-3 mb-3">
          <label class="form-label">别名</label>
          <input type="text" name="alias" class="form-control">
        </div>
        <div class="col-md-2 mb-3">
          <label class="form-label">年龄</label>
          <input type="text" name="age" class="form-control">
        </div>
        <div class="col-md-2 mb-3">
          <label class="form-label">性别</label>
          <select name="gender" class="form-select"><option value="">-</option><option value="女">女</option><option value="男">男</option><option value="其他">其他</option></select>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">简述</label>
        <textarea name="description" class="form-control" rows="3" placeholder="一两句话概括..."></textarea>
      </div>
    </div>
  </div>

  <div class="card mb-3">
    <div class="card-header d-flex justify-content-between align-items-center">
      描述卡片
      <button type="button" class="btn btn-sm btn-outline-primary" onclick="addCard()">+ 新建卡片</button>
    </div>
    <div class="card-body" id="cards-container">
      <p class="text-muted mb-0 small" id="no-cards-hint">可添加多张描述卡片，如外貌、性格、背景、武器……</p>
    </div>
  </div>

  <div class="card mb-3">
    <div class="card-header">人物图片</div>
    <div class="card-body">
      <input type="file" name="images" class="form-control" multiple accept="image/*">
      <small class="text-muted">支持 jpg/png/gif/webp，按住 Ctrl 可多选</small>
    </div>
  </div>

  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-primary">保存人物</button>
    <a href="{{ url_for('books.index') }}" class="btn btn-outline-secondary">取消</a>
  </div>
</form>
</div>
</div>
{% endblock %}

{% block scripts %}
<script>
function addCard() {
  const hint = document.getElementById('no-cards-hint'); if (hint) hint.style.display = 'none';
  const container = document.getElementById('cards-container');
  const div = document.createElement('div');
  div.style.cssText = 'background:#f9f9f9;border:1px solid #e0e0e0;border-radius:4px;padding:0.8rem;margin-bottom:0.6rem;';
  div.innerHTML = '<div class="d-flex justify-content-between align-items-start mb-2"><input type="text" name="field_name" class="form-control form-control-sm" placeholder="卡片标题" style="width:60%;font-weight:500;"><button type="button" class="btn btn-sm btn-ghost" onclick="this.closest(\'div\').remove()" style="font-size:1rem;line-height:1;">×</button></div><textarea name="field_value" class="form-control form-control-sm" rows="3" placeholder="卡片内容..."></textarea>';
  container.appendChild(div);
}
</script>
{% endblock %}
