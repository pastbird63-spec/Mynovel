{% extends 'base.html' %}
{% block title %}注册 · MyNovel{% endblock %}
{% block content %}
<div class="row justify-content-center">
<div class="col-md-5">
<div class="page-header">
  <h2>注册</h2>
</div>
<form method="POST">
  {{ csrf_token() }}
  <div class="card mb-3">
    <div class="card-body">
      <div class="mb-3">
        <label class="form-label">用户名</label>
        <input type="text" name="username" class="form-control" required autofocus placeholder="2-80 个字符">
      </div>
      <div class="mb-3">
        <label class="form-label">密码</label>
        <input type="password" name="password" class="form-control" required placeholder="至少 4 个字符">
      </div>
    </div>
  </div>
  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-primary">注册</button>
    <a href="{{ url_for('auth.login') }}" class="btn btn-outline-secondary">已有账号？去登录</a>
  </div>
</form>
</div>
</div>
{% endblock %}
