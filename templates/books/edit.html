{% extends 'base.html' %}
{% block title %}编辑 {{ book.title }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
<div class="col-md-7">
<h2 class="mb-4">编辑书目</h2>
<form method="POST">
  <div class="card mb-3">
    <div class="card-body">
      <div class="mb-3">
        <label class="form-label">书目类型</label>
        <div class="radio-group mb-2">
          <label class="radio-label"><input type="radio" name="type" value="writing"{{ ' checked' if book.type == 'writing' else '' }}> ✍️ 创作 — 写作自己的小说</label>
          <label class="radio-label"><input type="radio" name="type" value="reading"{{ ' checked' if book.type == 'reading' else '' }}> 📖 阅读 — 导入电子书做笔记</label>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">书名 <span class="text-danger">*</span></label>
        <input type="text" name="title" class="form-control" value="{{ book.title }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">题材</label>
        <input type="text" name="genre" class="form-control" value="{{ book.genre or '' }}">
      </div>
      <div class="mb-3">
        <label class="form-label">简介</label>
        <textarea name="description" class="form-control" rows="4">{{ book.description or '' }}</textarea>
      </div>
    </div>
  </div>
  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-primary">保存</button>
    <a href="{{ url_for('books.index', book_id=book.id) }}" class="btn btn-outline-secondary">取消</a>
  </div>
</form>
</div>
</div>
{% endblock %}
