{% extends 'base.html' %}
{% block title %}MyNovel{% endblock %}
{% block content %}
<script>
window.BOOKS_DATA = [
{% for item in books_data %}
  { id:{{ item.book.id }}, type:{{ item.book.type|tojson }}, title:{{ item.book.title|tojson }}, genre:{{ (item.book.genre or '')|tojson }}, description:{{ (item.book.description or '')|tojson }}, created_at:{{ item.book.created_at.strftime('%Y-%m')|tojson }},
    characters:[{% for c in item.book.characters %}{ id:{{c.id}},name:{{c.name|tojson}},alias:{{(c.alias or '')|tojson}},age:{{(c.age or '')|tojson}},gender:{{(c.gender or '')|tojson}},description:{{(c.description or '')|tojson}},images:[{% for img in c.images %}{filename:{{img.filename|tojson}}}{% if not loop.last %},{% endif %}{% endfor %}],custom_fields:[{% for f in c.custom_fields %}{name:{{f.field_name|tojson}},value:{{f.field_value|tojson}}}{% if not loop.last %},{% endif %}{% endfor %}]}{% if not loop.last %},{% endif %}{% endfor %}],
    plot_nodes:[{% for pn in item.book.plot_nodes %}{ id:{{pn.id}},parent_id:{{pn.parent_id or 'null'}},title:{{pn.title|tojson}},order:{{pn.order}},time_in_story:{{(pn.time_in_story or '')|tojson}},location:{{(pn.location or '')|tojson}},summary:{{(pn.summary or '')|tojson}},characters:[{% for pc in pn.plot_characters %}{id:{{pc.character.id}},name:{{pc.character.name|tojson}}}{% if not loop.last %},{% endif %}{% endfor %}],custom_fields:[{% for f in pn.custom_fields %}{name:{{f.field_name|tojson}},value:{{f.field_value|tojson}},is_flagged:{{'true' if f.is_flagged else 'false'}}}{% if not loop.last %},{% endif %}{% endfor %}]}{% if not loop.last %},{% endif %}{% endfor %}],
    world_settings:[{% for ws in item.world_settings %}{ id:{{ws.id}},category:{{ws.category|tojson}},title:{{ws.title|tojson}},content:{{(ws.content or '')|tojson}},fields:[{% for f in ws.fields %}{name:{{f.field_name|tojson}},value:{{f.field_value|tojson}}}{% if not loop.last %},{% endif %}{% endfor %}]}{% if not loop.last %},{% endif %}{% endfor %}]
  }{% if not loop.last %},{% endif %}
{% endfor %}
];
</script>

<div class="app-container" id="shelf-view">
  <div class="shelf-header">
    <h1>MyNovel</h1>
    <div class="shelf-header-actions">
      <button class="btn btn-sm btn-outline-secondary" id="btn-add-shelf-row">+ 加一行</button>
      <a href="{{ url_for('books.create') }}" class="btn btn-sm btn-primary">添加书</a>
    </div>
  </div>
  <input type="text" class="shelf-search" id="shelf-search" placeholder="搜索书架..." autocomplete="off">
  <div class="shelf-all" id="shelf-all"></div>
  {% if not books_data %}<div class="shelf-empty-state"><p>书架是空的，点击「添加书」开始</p></div>{% endif %}
</div>

<div class="book-view" id="book-view">
  <div class="book-topbar">
    <a class="book-back" id="btn-back" href="#">&larr; 书架</a>
    <span class="book-topbar-title" id="book-topbar-title"></span>
    <span style="flex:1"></span>
    <a href="#" id="btn-edit-book" class="btn btn-sm btn-outline-secondary">编辑</a>
    <a href="#" id="btn-write-book" class="btn btn-sm btn-primary">写作</a>
  </div>
  <div class="open-book-wrap">
    <div class="open-book" id="open-book">
      <div class="open-book-crease"></div>
      <div class="book-page book-page-left" id="book-page-left"><div id="page-left-content"></div></div>
      <div class="book-page book-page-right" id="book-page-right"><div id="page-right-content"></div></div>
      <div class="page-tabs" id="page-tabs">
        <div class="page-tab page-tab-char active" data-tab="char">人物</div>
        <div class="page-tab page-tab-plot" data-tab="plot">时间线</div>
        <div class="page-tab page-tab-world" data-tab="world">世界观</div>
      </div>
    </div>
  </div>
  <div class="pagination-bar" id="pagination-bar"></div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/search.js') }}"></script>
<script src="{{ url_for('static', filename='js/shelf.js') }}"></script>
<script src="{{ url_for('static', filename='js/book-view.js') }}"></script>
<script src="{{ url_for('static', filename='js/tab-chars.js') }}"></script>
<script src="{{ url_for('static', filename='js/tab-world.js') }}"></script>
<script src="{{ url_for('static', filename='js/timeline.js') }}"></script>
<script>
(function() {
  var DATA = window.BOOKS_DATA || [];
  var AppState = window.AppState;
  var LS_OPEN = 'mynovel-open-book';

  // ═══════════ 初始化 ═══════════
  function init() {
    try { AppState.spineColors = JSON.parse(localStorage.getItem('mynovel-colors')) || {}; } catch(e) { AppState.spineColors = {}; }
    try { AppState.rows = JSON.parse(localStorage.getItem('mynovel-rows')); } catch(e) { AppState.rows = null; }
    if (!AppState.rows || !Array.isArray(AppState.rows) || AppState.rows.length === 0) {
      AppState.rows = [];
      var ids = DATA.map(function(b) { return b.id; });
      for (var i = 0; i < ids.length; i += 6) AppState.rows.push(ids.slice(i, i + 6));
    }
    var valid = new Set(DATA.map(function(b) { return b.id; }));
    AppState.rows = AppState.rows.map(function(r) { return r.filter(function(id) { return valid.has(id); }); }).filter(function(r) { return r.length > 0; });
    var placed = new Set(AppState.rows.flat());
    DATA.forEach(function(b) {
      if (!placed.has(b.id)) { if (AppState.rows.length === 0) AppState.rows.push([]); AppState.rows[AppState.rows.length - 1].push(b.id); }
    });
    saveRows(); renderShelf();

    var savedId = localStorage.getItem(LS_OPEN);
    var params = new URLSearchParams(window.location.search);
    var urlBookId = parseInt(params.get('book_id')), urlTab = params.get('tab'), urlHL = parseInt(params.get('highlight'));
    if (urlBookId) {
      var bk = DATA.find(function(b) { return b.id === urlBookId; });
      if (bk) { setTimeout(function() { openBook(bk, urlTab || undefined, urlHL || 0); }, 150); window.history.replaceState({}, '', '/books/'); }
    } else if (savedId) {
      var bk2 = DATA.find(function(b) { return b.id === parseInt(savedId); });
      if (bk2) setTimeout(function() { openBook(bk2); }, 150);
    }

    // 书架搜索
    document.getElementById('shelf-search').addEventListener('input', onSearch);
    document.getElementById('shelf-search').addEventListener('keydown', function(e) { if (e.key === 'Escape') { this.value = ''; onSearch(); } });

    // 返回书架按钮
    document.getElementById('btn-back').addEventListener('click', function(e) { e.preventDefault(); closeBook(); });

    // 标签页切换
    document.querySelectorAll('#page-tabs .page-tab').forEach(function(tab) {
      tab.addEventListener('click', function() {
        AppState.currentTab = this.dataset.tab;
        AppState.currentSpread = 0;
        resetBookPages();
        document.querySelectorAll('#page-tabs .page-tab').forEach(function(t) { t.classList.remove('active'); });
        this.classList.add('active');
        renderContent();
      });
    });
  }

  init();
})();
</script>
{% endblock %}
